[project]
name = "mflowy"
version = "0.1.2"
description = "MCP-native ML capability layer for autonomous data-analysis / model-training / prediction agents — enumerable MCP tool catalog composed into traceable YAML-DAG experiment workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "lincode7", email = "15587025323@163.com" }]
keywords = ["mcp", "machine-learning", "workflow", "mlflow", "data-analysis", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 聚合包：五 distribution 锁步版本（tests/test_workspace.py 断言一致）
dependencies = [
    "mflowy-utils",
    "mflowy-driver",
    "mflowy-builtin-plugins",
    "mflowy-mcp",
]

[project.urls]
Repository = "https://github.com/ifoodsci-ai/mflowy"
Issues = "https://github.com/ifoodsci-ai/mflowy/issues"
Documentation = "https://github.com/ifoodsci-ai/mflowy#readme"

[project.optional-dependencies]
# extras 透传：用户端 mflowy[modeling] 体验与单包时代完全一致
stats = ["mflowy-builtin-plugins[stats]"]
modeling = ["mflowy-builtin-plugins[modeling]"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mflowy-utils = { workspace = true }
mflowy-driver = { workspace = true }
mflowy-builtin-plugins = { workspace = true }
mflowy-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 聚合包无自有代码：README 作 namespace 目录内容占位（PEP 420 禁止 mflowy/__init__.py）
force-include = { "README.md" = "mflowy/README.md" }

[tool.hatch.build.targets.sdist]
include = ["README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["*.ipynb"]

[tool.ruff.lint]
# E4/E7/E9/F: pycodestyle 核心错误 + pyflakes；I: import 排序；UP035/UP037: 废弃导入/引号注解
per-file-ignores = { "packages/builtin_plugins/mflowy/builtin_plugins/plots/model_evaluation/regression/_taylor_diagram_copin.py" = ["E741"], "packages/builtin_plugins/hatch_metadata.py" = ["E402"] }  # 后两者：vendored 代码原样保留 / hook 类定义需在扫描器之后
select = ["E4", "E7", "E9", "F", "I", "UP035", "UP037"]

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.uv.sources.torch]
index = "pytorch-cpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.15.8",
    "pre-commit>=3.0",
]
jupyter = [
    "nbformat>=5.10.4",
]
