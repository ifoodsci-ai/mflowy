[project]
name = "mflowy"
version = "0.2.0"
description = "MCP-native ML capability layer for autonomous data-analysis / model-training / prediction agents — enumerable MCP tool catalog composed into traceable YAML-DAG experiment workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "lincode7", email = "15587025323@163.com" }]
keywords = ["mcp", "machine-learning", "workflow", "mlflow", "data-analysis", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 聚合包：五 distribution 锁步版本（tests/test_workspace.py 断言一致）
dependencies = [
    "mflowy-utils",
    "mflowy-driver",
    "mflowy-mcp",
]

[project.urls]
Repository = "https://github.com/ifoodsci-ai/mflowy"
Issues = "https://github.com/ifoodsci-ai/mflowy/issues"
Documentation = "https://github.com/ifoodsci-ai/mflowy#readme"

[project.optional-dependencies]
# extras = 域选择器（2.0.0 起）：装哪个域包即得哪个域，重栈为域包硬依赖；
# [deep] = torch 栈（仅 MLP flavor，uvx 需 CPU 索引）；[stats]/[modeling] 已退役
data = ["mflowy-data"]
model = ["mflowy-model"]
mcp = ["mflowy-mcp[mcp]"]
deep = ["mflowy-model[deep]"]

[tool.uv.workspace]
members = ["packages/utils", "packages/driver", "packages/builtin_plugins/*", "packages/mcp"]

[tool.uv.sources]
mflowy-utils = { workspace = true }
mflowy-driver = { workspace = true }
mflowy-data = { workspace = true }
mflowy-model = { workspace = true }
mflowy-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 聚合包无自有代码：README 作 namespace 目录内容占位（PEP 420 禁止 mflowy/__init__.py）
force-include = { "README.md" = "mflowy/README.md" }

[tool.hatch.build.targets.sdist]
include = ["README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["*.ipynb"]

[tool.ruff.lint]
# E4/E7/E9/F: pycodestyle 核心错误 + pyflakes；I: import 排序；UP035/UP037: 废弃导入/引号注解
# B: bugbear 真 bug 面（B905 zip 显式 strict / B904 raise-from / B018 无效表达式等）；RUF: ruff 专属扩展
select = ["E4", "E7", "E9", "F", "I", "UP035", "UP037", "B", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003", # 中文文档仓库：docstring/注释/字符串内全角标点为有意用法
    "B008",                       # 签名即搜索空间：Space(...) 声明式默认值是设计而非缺陷（extract_search_spaces 反射消费）
]
# "**/tests/**" RUF059：测试解包惯用法（fixture 三元组取部分）非缺陷；
# 其余条目：vendored 原样保留 / 段三在飞文件域内命中随其改写收编后移除豁免
per-file-ignores = { "**/tests/**" = ["RUF059"], "packages/builtin_plugins/model/mflowy/model/plot/model_evaluation/regression/_taylor_diagram_copin.py" = ["E741", "B905"], "packages/builtin_plugins/model/mflowy/model/model/mlp.py" = ["B006"], "packages/builtin_plugins/model/mflowy/model/model/_pipeline.py" = ["B905", "RUF007"], "packages/builtin_plugins/model/tests/model/test_model_pipeline.py" = ["B018", "RUF012"], "packages/builtin_plugins/data/mflowy/data/cleaning_session.py" = ["RUF100"], "packages/builtin_plugins/data/mflowy/data/tools.py" = ["RUF013"], "packages/builtin_plugins/model/mflowy/model/model/types.py" = ["RUF100"], "packages/builtin_plugins/model/tests/test_modeling_session.py" = ["RUF043"], "packages/builtin_plugins/model/tests/model/test_study.py" = ["RUF100"], "packages/builtin_plugins/model/tests/model/trees/test_xgboost.py" = ["RUF100"] }

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.uv.sources.torch]
index = "pytorch-cpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.15.8",
    "pre-commit>=3.0",
    # 测试面含 telemetry/schema 契约（模块级 import SDK）——dev 环境须带 server 形态
    "mflowy-mcp[mcp]",
]
jupyter = [
    "nbformat>=5.10.4",
]
