# OpenResty（Nginx + LuaJIT）遥测网关 — 方案A（客户端对称秘密 + Talos importedApiKeys）
#
# 端点：
#   POST /device/register  设备幂等注册（telemetry-register.lua：限流→查询→换绑/创建）
#   POST /traces            OTLP 上报（telemetry-verify.lua：X-Telemetry-Token→Talos verify→otelite）
# 内部：
#   /_talos_admin/<path>  Talos admin API 子请求通道（路径后缀由 Lua 拼接，regex $1 转发）

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    lua_shared_dict register_limit 10m;  # 注册限流计数器

    upstream talos   { server talos:4420; }
    upstream otelite { server otelite:4318; }

    server {
        listen 2333;  # 生产：置于 TLS 终结（443/域名证书）之后

        # Talos 子请求通道（仅内部）— 目标路径由 Lua 拼在 URI 后缀，regex 捕获组 $1 转发
        # （不用自定义变量：capture vars 注入的值会被 set 在子请求 rewrite 阶段覆盖，实测不生效）
        location ~ ^/_talos_admin(/.*)$ {
            internal;
            proxy_pass http://talos$1$is_args$args;
            proxy_set_header Content-Type application/json;
            proxy_pass_request_body on;
        }

        # 设备注册（公开端点，Lua 内已限流；生产建议叠加 IP 白名单/更高强度限流）
        location = /device/register {
            content_by_lua_file conf/telemetry-register.lua;
        }

        # OTLP traces 上报（验证后转发 otelite）
        location = /traces {
            access_by_lua_file conf/telemetry-verify.lua;
            proxy_pass http://otelite/v1/traces;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
