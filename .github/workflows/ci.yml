name: CI

on:
  push:
    # dev 进 push 面（#107 防再犯）：本地直合 dev 绕过 PR CI，类型门债务曾在
    # 此盲区直通 release PR 才暴露——push 即跑门，把暴露点提前到集成时点
    branches: [main, dev]
    tags:
      - "v*" # 推送标签时触发
  pull_request:
  release:
    types: [published] # Release 发布时触发

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev deps
        run: uv sync --group dev
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Run linters
        run: make lint

  test:
    name: test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install all deps
        run: make install
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Run tests (coverage)
        run: make test-cov
      # 覆盖率工件（#43）：term 报告进 job 日志 + 步摘要，xml 工件供后续阈值化
      - name: Coverage step summary
        if: always()
        run: |
          { echo '```'; uv run coverage report; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  # 无 torch 环境证据（M6 验收/#43）：[deep] 隔离的环境级验证——显式 extras 不带
  # deep（dev 组自带 mcp 面）；list_nodes 词表降级（引擎侧降级已由 #49 钉测，此处
  # 验证真环境）+ RF 建模会话全链冒烟（MLP 用例 importorskip 自跳过）
  no-torch:
    name: no-torch (model extras without [deep])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install deps without [deep]
        run: uv sync --all-groups --extra data --extra model
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: 词表降级断言（MLP 条目 upstream=null + requires 标注 + RF 健康复核）
        run: |
          uv run mflowy list_nodes '{"namespace": "model"}' > "$RUNNER_TEMP/nodes.json"
          uv run python - "$RUNNER_TEMP/nodes.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          ns = next(n for n in data if n["namespace"] == "model")
          mlp = next(e for e in ns["nodes"] if e["name"] == "model__MLP")
          rf = next(e for e in ns["nodes"] if e["name"] == "model__RF")
          assert mlp["upstream"] is None, f"MLP 须降级 upstream=null（缺 [deep] extra），得到 {mlp['upstream']}"
          assert ns.get("requires") == {"MLP": "deep"}, f"requires 标注须为 MLP→deep，得到 {ns.get('requires')}"
          assert isinstance(rf["upstream"], list) and rf["upstream"], "RF 条目须可内省（防整体 import 崩溃的假阳性）"
          print(f"词表降级契约成立：model ns 共 {len(ns['nodes'])} 节点，MLP 降级 + RF 健康")
          PY
      - name: RF 建模会话冒烟（start→apply→finish 全链）
        run: uv run pytest packages/builtin_plugins/model/tests/test_modeling_session.py

  # 类型门（#42 决议→#91）：pyright basic 全仓（packages+tests），error 阻断、
  # warning 不挡；全量依赖安装（import 解析需要 model/deep extras）；runner 预装 Node
  typecheck:
    name: typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install all deps
        run: make install
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Run typecheck
        run: make typecheck

  release-build:
    name: Build and upload assets
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    if: github.event_name == 'release'
    permissions:
      contents: write # 用于上传资产到 Release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: make install
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Build wheel
        run: make build-whl
      - name: Upload wheel to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} dist/*.whl --clobber

  pypi-publish:
    name: Publish to PyPI (Trusted Publisher)
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # OIDC：Trusted Publisher 免 token 发布
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
