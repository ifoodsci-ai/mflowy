name: CI

on:
  push:
    # dev 进 push 面（#107 防再犯）：本地直合 dev 绕过 PR CI，类型门债务曾在
    # 此盲区直通 release PR 才暴露——push 即跑门，把暴露点提前到集成时点
    branches: [main, dev]
    tags:
      - "v*" # 推送标签时触发
  pull_request:
  release:
    types: [published] # Release 发布时触发

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev deps
        run: uv sync --group dev
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Run linters
        run: make lint

  test:
    name: test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install all deps
        run: make install
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Run tests (coverage)
        run: make test-cov
      # 覆盖率工件（#43）：term 报告进 job 日志 + 步摘要，xml 工件供后续阈值化
      - name: Coverage step summary
        if: always()
        run: |
          { echo '```'; uv run coverage report; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  # 瘦装门（#216 Q6.3/#217 + #210 bo 纳入修订）：[mcp] 单 extra = server 完全面
  # ——零本地建模重栈（重栈全进 model 包 [local] 后，no-torch 门随 [deep] 真合并
  # 消亡）；bo 随 [mcp] 牵入 optuna（#175 硬依赖，by design——ask 恒本地故 bo 引擎
  # 属 server 面，torch 仍隔离）。环境级验证：零重栈自证（optuna 除外）+ bo 工具
  # 可用 + 词表降级标注（model ns requires→local + 条目 upstream=null）+
  # get_node_info 降级面（available=false + 安装提示）+ remote 提交路径（mock
  # provider 受理即返）+ server stdio 冒烟；全量重栈环境见 test/typecheck 门（--all-extras）
  thin:
    name: thin (mcp-only server, remote-ready)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astralsh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install deps (mcp extra only)
        run: uv sync --all-groups --extra mcp
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: 瘦装断言（零重栈 + bo 工具可用 + 词表 requires→local 降级 + get_node_info 降级面）
        run: |
          uv run python - <<'PY'
          import importlib.util

          # sklearn 不在清单：mlflow（utils 硬依赖）传递随行——但五族模块统一 import
          # shap，缺 shap 即全族降级（RF 亦然），不依赖 sklearn 在缺的假设。
          # optuna 不在禁装清单：bo 随 [mcp] 牵入（#210——mflowy-bo 硬依赖，by design）
          for mod in ("lightgbm", "xgboost", "catboost", "shap", "torch"):
              assert importlib.util.find_spec(mod) is None, f"瘦装环境不应装重栈 {mod}"
          # bo 六工具随 server 完全面在场（ask 恒本地——optuna 属 server 面）
          from mflowy.bo.tools import bo_ask, bo_tell
          from mflowy.mcp.tools import get_node_info, list_nodes

          ns = next(n for n in list_nodes(namespace="model") if n["namespace"] == "model")
          xgb = next(e for e in ns["nodes"] if e["name"] == "model__XGB")
          assert xgb["upstream"] is None, f"瘦装 model 条目须降级 upstream=null，得到 {xgb}"
          requires = ns.get("requires", {})
          assert requires.get("XGB") == "local", f"requires 标注须 XGB→local，得到 {requires}"
          info = get_node_info("model", "XGB")
          assert info.get("available") is False and info.get("requires") == "local", info
          assert "mflowy[local]" in info.get("reason", ""), info
          degraded = sum(1 for e in ns["nodes"] if e["upstream"] is None)
          print(f"瘦装降级契约成立：model ns {len(ns['nodes'])} 节点中 {degraded} 降级 + requires→local；bo 工具在场")
          PY
      - name: remote 提交路径（mock provider 受理——零重栈提交自证）
        run: |
          mkdir -p "$RUNNER_TEMP/mockprov"
          cat > "$RUNNER_TEMP/mockprov/mock_provider.py" <<'PY'
          """瘦装门 mock provider：受理即返（remote 提交路径自证——零本地重栈依赖）。"""


          class MockProvider:
              async def hyperparameters_search(
                  self,
                  *,
                  modeling_steps: str,
                  name: str,
                  desc: str,
                  resume_study_from: str | None = None,
                  platform_experiment_id: str | None = None,
                  inherit_platform_job_id: str | None = None,
                  headers=None,
              ):
                  from mflowy.model.job_provider.protocol import JobOutcome

                  return JobOutcome.submitted(job_id="mock-job", platform_experiment_id="mock-exp")
          PY
          out=$(MFLOWY_JOB_PROVIDER=mock_provider:MockProvider PYTHONPATH="$RUNNER_TEMP/mockprov" \
            uv run mflowy hyperparameters_search '{"modeling_steps": "- name: 冒烟\n  namespace: load\n  node_name: python\n  params:\n    source: thin:gate", "name": "thin-gate", "desc": "mock submit"}')
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q submitted
      - name: server stdio 冒烟（瘦装可启）
        run: uv run python scripts/_e2e_mcp.py

  # 类型门（#42 决议→#91）：pyright basic 全仓（packages+tests），error 阻断、
  # warning 不挡；全量依赖安装（import 解析需要 mcp/local extras）；runner 预装 Node
  typecheck:
    name: typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install all deps
        run: make install
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Run typecheck
        run: make typecheck

  release-build:
    name: Build and upload assets
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    if: github.event_name == 'release'
    permissions:
      contents: write # 用于上传资产到 Release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: make install
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Build wheel
        run: make build-whl
      - name: Upload wheel to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} dist/*.whl --clobber

  pypi-publish:
    name: Publish to PyPI (Trusted Publisher)
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # OIDC：Trusted Publisher 免 token 发布
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
