name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*" # 推送标签时触发
  pull_request:
  release:
    types: [published] # Release 发布时触发

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev deps
        run: uv sync --group dev
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Run linters
        run: make lint

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install all deps
        run: make install
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Run tests
        run: make test

  release-build:
    name: Build and upload assets
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'release'
    permissions:
      contents: write # 用于上传资产到 Release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: make install
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Build wheel
        run: make build-whl
      - name: Upload wheel to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} dist/*.whl --clobber

  pypi-publish:
    name: Publish to PyPI (Trusted Publisher)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # OIDC：Trusted Publisher 免 token 发布
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
