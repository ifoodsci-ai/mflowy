[project]
name = "mflowy-driver"
version = "0.1.2"
description = "MFlowy DAG driver — YAML compile, context scheduling, @handler plugin SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mflowy-utils",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
modeling = ["mflowy-utils[modeling]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# namespace 包（PEP 420）：src/mflowy 只剥 src 前缀，产出 mflowy/<portion>；
# editable 经 pth 指向 src，多成员 portion 合成，零拷贝真 editable
packages = ["src/mflowy"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml"]

[tool.uv.sources]
mflowy-utils = { workspace = true }
