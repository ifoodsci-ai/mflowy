[project]
name = "mflowy-mcp"
version = "0.1.2"
description = "MFlowy MCP layer — stdio server, tools, JSON runner, JobProviders"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mflowy-builtin-plugins",
    # MCP 工具层（server 直接导入 mcp.server.mcpserver，需 SDK ≥2.0）
    "mcp>=2.0.0",
    # 工具参数描述注解（Annotated[..., Field]；mcp SDK 传递依赖，因直接 import 显式声明）
    "pydantic>=2.0",
    # MCP 遥测采集（agentcat.track 纯 OTLP 模式，懒加载；缺失时遥测降级 off）
    "agentcat>=2.0.2",
    # 遥测设备指纹（machine-id，跨平台；仅 Windows 需 winregistry）
    "py-machineid>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# namespace 包（PEP 420）：src/mflowy 只剥 src 前缀，产出 mflowy/<portion>；
# editable 经 pth 指向 src，多成员 portion 合成，零拷贝真 editable
packages = ["mflowy"]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
include = ["mflowy", "pyproject.toml"]

[tool.uv.sources]
mflowy-builtin-plugins = { workspace = true }

[project.scripts]
# MCP server — stdio transport
mcpSrv = "mflowy.mcp.server:main"
# JSON runner — K8s Job 容器 + subprocess 通用入口
cmd = "mflowy.mcp.runner:main"
