[project]
name = "mflowy-model"
version = "0.2.0"
description = "MFlowy model domain — x_y / cross_validation / x_transformer / model / plots(evaluation+interpretability)（建模训练 MDP 的动作域）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# entry-points 由 hatch_metadata.py 构建期生成
dynamic = ["entry-points"]
# CPU 建模栈为硬依赖；torch 栈隔离进 [deep]（uvx 需 CPU 索引，仅装 MLP 时需要）
dependencies = [
    "mflowy-data",
    # 图表主题门面（plot 子树共享 mflowy.utils.plot）
    "mflowy-utils[plot]",
    "scikit-learn>=1.9.0",
    "lightgbm>=4.6.0",
    "xgboost-cpu>=3.0.0",
    "catboost>=1.2",
    "optuna>=4.8.0",
    "shap>=0.52.0",
    # 直用科学栈（session/diagnose/report；import 即声明——不靠 sklearn 传递侥幸）
    "numpy>=2.0.0",
    "pandas>=2.2,<3",
    "scipy>=1.17.0",
]

[project.optional-dependencies]
deep = [
    "torch>=2.12.0",
    "pytorch-lightning>=2.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mflowy"]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
include = ["mflowy", "pyproject.toml", "hatch_metadata.py"]

[tool.hatch.metadata.hooks.custom]
# 构建期扫描 mflowy/model/** 的 @handler 生成内置插件 entry points（组：mflowy.builtin_plugins）
path = "hatch_metadata.py"

[tool.uv.sources]
mflowy-data = { workspace = true }
mflowy-utils = { workspace = true }

[tool.mflowy.tools]
# 域工具注册表（手工声明，无装饰器）；hatch 钩子并入 entry points 组 mflowy.tools，
# 镜像测试断言本表 ≡ mflowy/model/tools.py 公有函数
validate_modeling_steps = "mflowy.model.tools:validate_modeling_steps"
modeling_session_start = "mflowy.model.tools:modeling_session_start"
modeling_propose = "mflowy.model.tools:modeling_propose"
modeling_apply = "mflowy.model.tools:modeling_apply"
modeling_rollback = "mflowy.model.tools:modeling_rollback"
modeling_finish = "mflowy.model.tools:modeling_finish"
modeling_report_findings = "mflowy.model.tools:modeling_report_findings"
taylor_diagram_report = "mflowy.model.tools:taylor_diagram_report"
modeling_abandon = "mflowy.model.tools:modeling_abandon"
hyperparameters_search = "mflowy.model.tools:hyperparameters_search"
modeling = "mflowy.model.tools:modeling"
explanation = "mflowy.model.tools:explanation"
predict = "mflowy.model.tools:predict"
inverse_optimization = "mflowy.model.tools:inverse_optimization"
