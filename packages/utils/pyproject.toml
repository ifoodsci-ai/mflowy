[project]
name = "mflowy-utils"
version = "0.2.0"
description = "MFlowy shared utilities — mlflow helpers, jinja sandbox, logging, capture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # mlflow 工具层（tracking/experiment 封装）
    "mlflow>=3.14",
    # jinja 沙箱模板
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
# 图表环境就绪 + 主题门面（mflowy.utils.plot）——两域包默认依赖本 extra
plot = [
    "numpy>=2.0.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mflowy"]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
include = ["mflowy", "pyproject.toml"]
