[project]
name = "mflowy-utils"
version = "0.1.2"
description = "MFlowy shared utilities — mlflow helpers, optuna search spaces, logging, capture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # mlflow 工具层（tracking/experiment 封装）
    "mlflow>=3.14",
    # jinja 沙箱模板
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
# study.py（超参搜索空间）属 [modeling] 层；driver 懒加载，缺 extra 时目录查询不受影响
modeling = ["optuna>=4.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mflowy"]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
include = ["mflowy", "pyproject.toml"]
