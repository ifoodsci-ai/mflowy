# Combined Cycle Power Plant — modeling steps
- name: 加载电厂工况数据
  type: load
  module: python
  params:
    source: power_plant.py:load

- name: X/y 拆分
  type: X_y
  module: x_y
  params:
    targets: net_hourly_electrical_energy_output

- name: K-Fold CV
  type: cross_validate
  module: k_fold
  params:
    n_splits: 5

- name: 模型训练与评估
  branches:
    - name: XGBoost
      type: model
      module: XGB
      params: { n_estimators: 200, n_trials: 30, scoring: mae }
    - name: LightGBM
      type: model
      module: LGBM
      params: { n_estimators: 200, n_trials: 30, scoring: mae }
    - name: CatBoost
      type: model
      module: CAT
      params: { iterations: 200, n_trials: 30, scoring: mae }
    - name: RandomForest
      type: model
      module: RF
      params: { n_estimators: 200, n_trials: 30, scoring: mae }
