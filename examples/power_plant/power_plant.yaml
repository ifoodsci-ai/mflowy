- load__python:
    name: 加载电厂工况数据
    params:
      source: power_plant.py:load
- x_y:
    name: X/y 拆分
    params:
      targets: net_hourly_electrical_energy_output
- split:
    name: K-Fold CV
    params:
      cv: 5
- model__XGB:
    name: XGBoost
    params:
      n_estimators: 200
      n_trials: 30
      scoring: mae
- model__LGBM:
    name: LightGBM
    params:
      n_estimators: 200
      n_trials: 30
      scoring: mae
- model__CAT:
    name: CatBoost
    params:
      iterations: 200
      n_trials: 30
      scoring: mae
- model__RF:
    name: RandomForest
    params:
      n_estimators: 200
      n_trials: 30
      scoring: mae
