# Concrete Compressive Strength — modeling steps
# 配合 `cmd modeling` / `cmd explanation` JSON runner 使用；正式配置：k_fold[5] + 训练 200 / 搜索 30
- name: 加载混凝土数据
  type: load
  module: python
  params:
    source: concrete.py:load

- name: X/y 拆分
  type: X_y
  module: x_y
  params:
    targets: strength

- name: K-Fold CV
  type: cross_validate
  module: k_fold
  params:
    n_splits: 5

- name: 模型训练与评估
  branches:
    - name: XGBoost
      type: model
      module: XGB
      params: {n_estimators: 200, n_trials: 30, scoring: mae}
    - name: LightGBM
      type: model
      module: LGBM
      params: {n_estimators: 200, n_trials: 30, scoring: mae}
    - name: CatBoost
      type: model
      module: CAT
      params: {iterations: 200, n_trials: 30, scoring: mae}
    - name: RandomForest
      type: model
      module: RF
      params: {n_estimators: 200, n_trials: 30, scoring: mae}
