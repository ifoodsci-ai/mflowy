- name: "加载"
  type: load
  module: python
  params:
    source: multilabel.py:load
- name: "X/y 拆分"
  type: X_y
  module: x_y
  params:
    targets: ["label_0", "label_1", "label_2", "label_3", "label_4"]
- name: "数据集划分"
  type: cross_validate
  module: stratified_k_fold
  params:
    n_splits: 4
- name: "模型训练与评估"
  branches:
    - name: "RandomForest"
      type: model
      module: RF
      params:
        n_estimators: 30
        n_trials: 2
    - name: "标准化"
      type: x_transformer
      module: standard_scaler
      params:
        numerical_cols: []
      steps:
        - name: "MLP"
          type: model
          module: MLP
          params:
            n_trials: 2
            epochs: 10
            batch_size: 16
            hidden_dims: [16, 8, 4]
