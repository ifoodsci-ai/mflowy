- load__python:
    name: 加载
    params:
      source: multilabel.py:load
- x_y:
    name: X/y 拆分
    params:
      targets:
      - label_0
      - label_1
      - label_2
      - label_3
      - label_4
- split:
    name: 数据集划分
    params:
      cv: 4
- model__RF:
    name: RandomForest
    params:
      n_estimators: 30
      n_trials: 2
- x_transformer__standard_scaler:
    name: 标准化
    params:
      numerical_cols: []
- model__MLP:
    name: MLP
    params:
      n_trials: 2
      epochs: 10
      batch_size: 16
      hidden_dims:
      - 16
      - 8
      - 4
