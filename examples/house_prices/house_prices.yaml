- name: 加载房价数据
  type: load
  module: python
  params:
    source: house_prices.py:load

- name: 删除Id列
  type: clean
  module: common_filter
  params:
    drop: [Id]

- name: 填充缺失值
  type: clean
  module: fill_missing
  params:
    strategy: median
    columns: [LotFrontage, MasVnrArea]

- name: X/y 拆分
  type: X_y
  module: x_y
  params:
    targets: SalePrice

- name: 数据集划分
  type: cross_validate
  module: repeated_k_fold
  params:
    n_splits: 5
    n_repeats: 2

- name: 模型训练与评估
  branches:
    - name: XGBoost
      type: model
      module: XGB
      params:
        n_estimators: 100
        n_trials: 2
        scoring: mae
        max_depth: {start: 3, end: 10}
        learning_rate: {start: 0.005, end: 0.3, step: log}
        subsample: {start: 0.5, end: 1.0}
        reg_alpha: {start: 1.0e-8, end: 10.0, step: log}
        reg_lambda: {start: 1.0e-8, end: 10.0, step: log}
    - name: LightGBM
      type: model
      module: LGBM
      params:
        n_estimators: 100
        n_trials: 2
        scoring: mae
        num_leaves: {start: 15, end: 127}
        max_depth: {start: 3, end: 10}
        learning_rate: {start: 0.005, end: 0.3, step: log}
        subsample: {start: 0.5, end: 1.0}
        reg_alpha: {start: 1.0e-8, end: 10.0, step: log}
        reg_lambda: {start: 1.0e-8, end: 10.0, step: log}
        path_smooth: {start: 0.0, end: 10.0}
    - name: CatBoost
      type: model
      module: CAT
      params:
        iterations: 100
        n_trials: 2
        scoring: mae
        depth: {start: 3, end: 10}
        learning_rate: {start: 0.005, end: 0.3, step: log}
        l2_leaf_reg: {start: 1.0e-8, end: 10.0, step: log}
        random_strength: {start: 0.0, end: 10.0}
    - name: 标签编码
      type: x_transformer
      module: ordinal_encoder
      params:
        categorical_cols: [Neighborhood, HouseStyle]
      steps:
        - name: RandomForest
          type: model
          module: RF
          params:
            n_estimators: 100
            n_trials: 2
            scoring: mae
            max_depth: {start: 3, end: 10}
            min_samples_split: {start: 2, end: 20}
            min_samples_leaf: {start: 5, end: 50}
            ccp_alpha: {start: 0.0, end: 0.1}

- name: 模型对比
  type: plot
  module: taylor_diagram
