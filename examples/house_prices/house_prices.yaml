- load__python:
    name: 加载房价数据
    params:
      source: house_prices.py:load
- clean__drop_cols:
    name: 删除Id列
    params:
      cols:
      - Id
- clean__fill_median:
    name: 填充缺失值
    params:
      cols:
      - LotFrontage
      - MasVnrArea
- x_y:
    name: X/y 拆分
    params:
      target: SalePrice
- cv__split:
    name: 数据集划分
    params:
      cv: 5
      repeats: 2
- model__XGB:
    name: XGBoost
    params:
      n_estimators: 100
      n_trials: 2
      scoring: mae
      max_depth:
        start: 3
        end: 10
      learning_rate:
        start: 0.005
        end: 0.3
        step: log
      subsample:
        start: 0.5
        end: 1.0
      reg_alpha:
        start: 1.0e-08
        end: 10.0
        step: log
      reg_lambda:
        start: 1.0e-08
        end: 10.0
        step: log
- model__LGBM:
    name: LightGBM
    params:
      n_estimators: 100
      n_trials: 2
      scoring: mae
      num_leaves:
        start: 15
        end: 127
      max_depth:
        start: 3
        end: 10
      learning_rate:
        start: 0.005
        end: 0.3
        step: log
      subsample:
        start: 0.5
        end: 1.0
      reg_alpha:
        start: 1.0e-08
        end: 10.0
        step: log
      reg_lambda:
        start: 1.0e-08
        end: 10.0
        step: log
      path_smooth:
        start: 0.0
        end: 10.0
- model__CAT:
    name: CatBoost
    params:
      iterations: 100
      n_trials: 2
      scoring: mae
      depth:
        start: 3
        end: 10
      learning_rate:
        start: 0.005
        end: 0.3
        step: log
      l2_leaf_reg:
        start: 1.0e-08
        end: 10.0
        step: log
      random_strength:
        start: 0.0
        end: 10.0
- x_transformer__ordinal_encoder:
    name: 标签编码
    params:
      categorical_cols:
      - Neighborhood
      - HouseStyle
- model__RF:
    name: RandomForest
    params:
      n_estimators: 100
      n_trials: 2
      scoring: mae
