- load__python:
    name: 加载
    params:
      source: iris.py:load
- x_y:
    name: X/y 拆分
    params:
      targets: target
- split:
    name: 数据集划分
    params:
      cv: 2
      repeats: 2
- model__XGB:
    name: XGBoost
    params:
      n_estimators: 30
      n_trials: 2
- model__LGBM:
    name: LightGBM
    params:
      n_estimators: 30
      n_trials: 2
- model__CAT:
    name: CatBoost
    params:
      iterations: 30
      n_trials: 2
- model__RF:
    name: RandomForest
    params:
      n_estimators: 30
      n_trials: 2
- x_transformer__standard_scaler:
    name: 标准化
    params:
      numerical_cols: []
- model__MLP:
    name: MLP
    params:
      n_trials: 2
      epochs: 10
      batch_size: 16
      hidden_dims:
      - 16
      - 8
      - 4
